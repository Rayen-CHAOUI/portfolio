<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact | CHAOUI Rayen</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="../index.html">CHAOUI <span>Rayen</span></a>
      <nav class="nav" id="siteNav">
        <a href="../index.html#about">About</a>
        <a href="../index.html#skills">Skills</a>
        <a href="../projects/projects.html">Projects</a>
        <a href="contact_me.html" aria-current="page">Contact</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" id="darkModeToggle" type="button" aria-label="Switch theme">☀</button>
        <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-label="Open menu">☰</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="container contact-wrap">
      <div class="page-hero">
        <p class="kicker">Contact</p>
        <h1>Get in touch</h1>
        <p class="lead">If you have a question, internship, or collaboration in mind, send a message and I will get back to you.</p>
        <div class="social-links" style="justify-content: flex-start; margin-top: 1.6rem;">
          <a href="https://github.com/Rayen-CHAOUI" target="_blank" rel="noopener">GitHub</a>
          <a href="mailto:chaouirayen@gmail.com">Email</a>
          <a href="https://www.linkedin.com/in/Rayen-CHAOUI/" target="_blank" rel="noopener">LinkedIn</a>
          <a href="https://www.instagram.com/rayen.chaoui/" target="_blank" rel="noopener">Instagram</a>
        </div>
      </div>

      <form class="contact-form" id="contactForm">
        <div class="form-group">
          <label for="name">Your name</label>
          <input type="text" name="name" id="name" required />
        </div>
        <div class="form-group">
          <label for="email">Your email</label>
          <input type="email" name="email" id="email" required />
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea name="message" id="message" rows="6" required></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn">Send message</button>
          <a class="btn btn-ghost" href="../index.html">Back home</a>
        </div>
        <p id="formStatus"></p>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© 2026 CHAOUI Rayen</span>
      <span>Software Engineering · Algeria</span>
    </div>
  </footer>
  <script src="../js/script.js"></script>
</body>
</html>
